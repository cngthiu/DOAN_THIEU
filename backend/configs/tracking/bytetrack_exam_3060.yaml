tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.35
track_buffer: 60
# Keep low-confidence, partially occluded students recoverable for about three
# seconds while retaining score fusion to avoid weak duplicate associations.
match_thresh: 0.85
fuse_score: true
lost_track_hold_ms: 3000
